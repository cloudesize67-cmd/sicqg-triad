[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sicqg_triad"
version = "0.1.0"
description = "Triadic self-improving architecture: superposition registry + formal gate + quality-diversity archive"
requires-python = ">=3.10"
dependencies = [
    "z3-solver",
    "requests",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
sicqg-triad = "sicqg_triad.cli:main"

[tool.setuptools]
packages = ["sicqg_triad"]
